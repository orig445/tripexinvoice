<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>מיילו: שימוש ועלות</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Secular+One&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  :root {
    --ground: #F2F5F8; --surface: #FFFFFF; --ink: #15202B; --muted: #5B6978; --line: #DCE3EA;
    --accent: #1D5BD6; --accent-soft: #E6EEFC; --bar: #1D5BD6; --bar-empty: #DCE3EA;
    --warn: #B93F0C; --warn-soft: #FCEBE2; --code-bg: #EEF2F6;
    --display: "Secular One", "Assistant", "Segoe UI", Arial, sans-serif;
    --body: "Assistant", "Segoe UI", Arial, sans-serif;
    --mono: "JetBrains Mono", Consolas, "Courier New", monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --ground: #0E141B; --surface: #16202A; --ink: #E5ECF3; --muted: #94A3B3; --line: #273442;
      --accent: #74A3FF; --accent-soft: #1B2B47; --bar: #74A3FF; --bar-empty: #273442;
      --warn: #FF9A5C; --warn-soft: #3A2217; --code-bg: #0F1821;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--ground); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.5; }
  .page { max-width: 1040px; margin: 0 auto; padding-inline: 16px; padding-block: 24px 56px; display: flex; flex-direction: column; gap: 18px; }
  h1 { font-family: var(--display); font-weight: 400; font-size: clamp(26px, 5vw, 34px); margin: 0; line-height: 1.15; }
  h2 { font-size: 18px; margin: 0; }
  .muted { color: var(--muted); }

  .bar-controls { display: flex; flex-wrap: wrap; align-items: end; gap: 10px 14px; }
  .field { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); font-weight: 600; }
  input[type="date"] { font: 15px var(--body); padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); }
  .presets { display: flex; flex-wrap: wrap; gap: 6px; }
  button, .btn { font: 600 14px var(--body); padding: 7px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; }
  button.primary, .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:focus-visible, .btn:focus-visible, input:focus-visible, tr[tabindex]:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
  .kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; }
  .kpi .label { font-size: 13px; color: var(--muted); font-weight: 600; }
  .kpi .value { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .kpi.cost .value { color: var(--accent); }
  .kpi .sub { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .chart-wrap { overflow-x: auto; direction: ltr; }
  .chart-wrap svg { direction: ltr; display: block; }
  svg text { fill: var(--muted); font-family: var(--body); font-size: 11px; }

  .table-wrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 15px; font-variant-numeric: tabular-nums; }
  th, td { text-align: right; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { font-size: 12px; color: var(--muted); font-weight: 700; letter-spacing: .02em; }
  td.num, th.num { text-align: left; direction: ltr; }
  tr.company { cursor: pointer; }
  tr.company:hover { background: var(--accent-soft); }
  tr.company td:first-child::before { content: "◂"; display: inline-block; width: 1.2em; color: var(--muted); transition: transform .15s ease; }
  tr.company.open td:first-child::before { transform: rotate(-90deg); }
  tr.users > td { padding: 0 0 8px; background: var(--ground); }
  tr.users table { font-size: 14px; }
  tr.users th, tr.users td { padding: 6px 10px 6px 10px; }
  tr.users td:first-child, tr.users th:first-child { padding-inline-start: 34px; }
  .share { display: inline-block; height: 6px; border-radius: 99px; background: var(--bar); vertical-align: middle; margin-inline-start: 8px; }
  .unknown { color: var(--muted); font-style: italic; }

  .note { background: var(--warn-soft); border-radius: 10px; padding: 10px 14px; font-size: 14px; }
  .fine { font-size: 13px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
  code { font-family: var(--mono); font-size: 12px; background: var(--code-bg); padding: 1px 5px; border-radius: 4px; direction: ltr; unicode-bidi: isolate; }
  .empty { padding: 24px; text-align: center; color: var(--muted); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="page">
  <header style="display:flex;flex-direction:column;gap:6px">
    <h1>מיילו: שימוש ועלות</h1>
    <p class="muted" style="margin:0">כמה השתמשו בצ'אט בוט ומה זה עלה ב-Oracle OCI Generative AI, לפי חברה ולפי משתמש. העלות היא הערכה לפי מספר הטוקנים.</p>
  </header>

  <div class="bar-controls">
    <label class="field">מתאריך<input type="date" id="from"></label>
    <label class="field">עד תאריך<input type="date" id="to"></label>
    <button type="button" class="primary" id="apply">הצג</button>
    <div class="presets" role="group" aria-label="טווחים מהירים">
      <button type="button" data-preset="month">החודש</button>
      <button type="button" data-preset="last-month">החודש הקודם</button>
      <button type="button" data-preset="7">7 ימים</button>
      <button type="button" data-preset="30">30 ימים</button>
    </div>
    <a class="btn" id="export" href="#">ייצוא לאקסל</a>
    <button type="button" id="import">ייבוא היסטוריה מהלוג</button>
  </div>

  <div id="import-result" class="note" style="background:var(--accent-soft)" hidden></div>

  <div id="error" class="note" hidden></div>

  <section class="kpis" aria-live="polite">
    <div class="kpi cost"><span class="label">עלות משוערת</span><span class="value" id="k-cost">—</span><span class="sub" id="k-cost-sub"></span></div>
    <div class="kpi"><span class="label">שיחות</span><span class="value" id="k-conv">—</span><span class="sub" id="k-conv-sub"></span></div>
    <div class="kpi"><span class="label">תשובות של מיילו</span><span class="value" id="k-ans">—</span><span class="sub" id="k-ans-sub"></span></div>
    <div class="kpi"><span class="label">טוקנים</span><span class="value" id="k-tok">—</span><span class="sub" id="k-tok-sub"></span></div>
  </section>

  <section class="card">
    <h2>עלות לפי יום</h2>
    <div class="chart-wrap" id="chart"></div>
  </section>

  <section class="card">
    <h2>לפי חברה</h2>
    <p class="muted" style="margin:0;font-size:14px">לחיצה על חברה פותחת את המשתמשים שלה.</p>
    <div class="table-wrap" id="companies"></div>
  </section>

  <div class="fine" id="fine"></div>
</div>

<script>
(function () {
  var m = location.pathname.match(/^(.*)\/usage\/([^\/]+)\/?$/);
  var base = m ? m[1] : "";
  var key = m ? m[2] : "";
  var $ = function (id) { return document.getElementById(id); };

  var money = function (v) {
    var digits = v > 0 && v < 10 ? 4 : 2;
    return new Intl.NumberFormat("en-US", { style: "currency", currency: "USD", minimumFractionDigits: 2, maximumFractionDigits: digits }).format(v || 0);
  };
  var num = function (v) { return new Intl.NumberFormat("he-IL").format(v || 0); };
  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); };
  var iso = function (d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };

  function setPreset(p) {
    var now = new Date(), from, to = now;
    if (p === "month") from = new Date(now.getFullYear(), now.getMonth(), 1);
    else if (p === "last-month") { from = new Date(now.getFullYear(), now.getMonth() - 1, 1); to = new Date(now.getFullYear(), now.getMonth(), 0); }
    else { from = new Date(now); from.setDate(now.getDate() - (Number(p) - 1)); }
    $("from").value = iso(from); $("to").value = iso(to);
  }

  function query() { return "from=" + encodeURIComponent($("from").value) + "&to=" + encodeURIComponent($("to").value); }

  function load() {
    $("error").hidden = true;
    $("export").href = base + "/api/usage/" + key + "/export?" + query();
    fetch(base + "/api/usage/" + key + "/summary?" + query(), { cache: "no-store" })
      .then(function (r) {
        if (!r.ok) return r.json().catch(function () { return {}; }).then(function (b) { throw new Error(b.error || ("השרת החזיר " + r.status)); });
        return r.json();
      })
      .then(render)
      .catch(function (e) { $("error").textContent = "לא הצלחתי לטעון את הנתונים: " + e.message; $("error").hidden = false; });
  }

  function render(s) {
    var t = s.totals;
    $("k-cost").textContent = money(t.costUsd);
    $("k-cost-sub").textContent = t.answers ? "בממוצע " + money(t.costUsd / t.answers) + " לתשובה" : "";
    $("k-conv").textContent = num(t.conversations);
    $("k-conv-sub").textContent = t.conversations ? "בממוצע " + money(t.costUsd / t.conversations) + " לשיחה" : "";
    $("k-ans").textContent = num(t.answers);
    $("k-ans-sub").textContent = s.companies.length ? s.companies.length + " חברות" : "";
    $("k-tok").textContent = num(t.inputTokens + t.outputTokens);
    $("k-tok-sub").textContent = "קלט " + num(t.inputTokens) + " · פלט " + num(t.outputTokens);

    renderChart(s.days);
    renderCompanies(s.companies, t.costUsd);

    var prices = s.prices.map(function (p) { return "<code>" + esc(p.model) + "</code> קלט $" + p.inputPerMillion + " · פלט $" + p.outputPerMillion + " למיליון טוקנים"; }).join("<br>");
    var unpriced = s.unpricedModels.length
      ? "<span style=\"color:var(--warn)\">אין מחיר למודל " + s.unpricedModels.map(function (x) { return "<code>" + esc(x) + "</code>"; }).join(", ") + ", ולכן הוא לא נספר בעלות. אפשר להוסיף מחיר בהגדרה <code>Milo:Pricing</code>.</span>"
      : "";
    $("fine").innerHTML =
      (prices ? "<span>המחירים שבשימוש: " + prices + "</span>" : "") + unpriced +
      "<span>פלט כולל גם את טוקני החשיבה של המודל, שלא מופיעים בתשובה אבל מחויבים. ימים לפי שעון ישראל.</span>" +
      "<span>זו הערכה. החשבון האמיתי נמצא ב-OCI Console, תחת Billing &amp; Cost Management ← Cost Analysis, בשירות Generative AI.</span>" +
      "<span>הטוקנים הם המספרים ש-Oracle עצמה מחזירה בכל תשובה. מהעדכון של 29.9.2026 הם נשמרים בזמן אמת, ומה שלפניו מיובא מקובצי הלוג של מיילו, שנשמרים 30 יום. שיחה שבה החברה לא ידועה, כי הווידג'ט עוד לא שלח את כתובת המערכת, מקבלת את החברה של אותו משתמש משיחות אחרות, אם יש לו רק חברה אחת. אחרת היא מופיעה תחת \"לא ידוע\".</span>";
  }

  function renderChart(days) {
    var w = Math.max(640, days.length * 22), h = 190, padL = 56, padB = 28, padT = 10;
    var max = Math.max.apply(null, days.map(function (d) { return d.costUsd; }).concat([0]));
    var top = max > 0 ? niceCeil(max) : 1;
    var bw = (w - padL - 8) / Math.max(days.length, 1);
    var y = function (v) { return padT + (h - padT - padB) * (1 - v / top); };
    var parts = ['<svg viewBox="0 0 ' + w + ' ' + h + '" width="' + w + '" height="' + h + '" role="img" aria-label="עלות לפי יום">'];
    [0, 0.5, 1].forEach(function (f) {
      var v = top * f, yy = y(v);
      parts.push('<line x1="' + padL + '" x2="' + (w - 4) + '" y1="' + yy + '" y2="' + yy + '" stroke="var(--line)" stroke-width="1"/>');
      parts.push('<text x="' + (padL - 6) + '" y="' + (yy + 4) + '" text-anchor="end">' + esc(money(v)) + '</text>');
    });
    var every = Math.ceil(days.length / 12);
    days.forEach(function (d, i) {
      var x = padL + i * bw + bw * 0.15, bh = (h - padT - padB) * (d.costUsd / top);
      var fill = d.costUsd > 0 ? "var(--bar)" : "var(--bar-empty)";
      parts.push('<rect x="' + x.toFixed(1) + '" y="' + (y(d.costUsd) - (d.costUsd > 0 ? 0 : 1)).toFixed(1) + '" width="' + (bw * 0.7).toFixed(1) + '" height="' + Math.max(bh, d.costUsd > 0 ? 1 : 1).toFixed(1) + '" rx="2" fill="' + fill + '"><title>' + esc(d.date + ": " + money(d.costUsd) + ", " + d.answers + " תשובות") + '</title></rect>');
      if (i % every === 0) parts.push('<text x="' + (x + bw * 0.35).toFixed(1) + '" y="' + (h - 8) + '" text-anchor="middle">' + esc(d.date.slice(8) + "/" + d.date.slice(5, 7)) + '</text>');
    });
    parts.push("</svg>");
    $("chart").innerHTML = parts.join("");
  }

  function niceCeil(v) {
    var p = Math.pow(10, Math.floor(Math.log10(v))), n = v / p;
    return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p;
  }

  function renderCompanies(companies, totalCost) {
    if (!companies.length) {
      $("companies").innerHTML = '<div class="empty">אין שימוש שמור בטווח הזה. כדי להוסיף את השימוש מלפני העדכון, לוחצים על "ייבוא היסטוריה מהלוג".</div>';
      return;
    }
    var head = '<table><thead><tr><th>חברה</th><th class="num">שיחות</th><th class="num">תשובות</th><th class="num">טוקני קלט</th><th class="num">טוקני פלט</th><th class="num">עלות</th><th>חלק מהעלות</th></tr></thead><tbody>';
    var rows = companies.map(function (c, i) {
      var share = totalCost > 0 ? c.costUsd / totalCost : 0;
      var name = c.company ? esc(c.company) : '<span class="unknown">לא ידוע</span>';
      var users = '<table><thead><tr><th>משתמש</th><th class="num">שיחות</th><th class="num">תשובות</th><th class="num">טוקני קלט</th><th class="num">טוקני פלט</th><th class="num">עלות</th></tr></thead><tbody>' +
        c.users.map(function (u) {
          var who = u.email ? esc(u.email) + (u.name ? ' <span class="muted">(' + esc(u.name) + ')</span>' : "") : '<span class="unknown">בלי מייל</span>';
          return '<tr><td>' + who + '</td><td class="num">' + num(u.conversations) + '</td><td class="num">' + num(u.answers) + '</td><td class="num">' + num(u.inputTokens) + '</td><td class="num">' + num(u.outputTokens) + '</td><td class="num">' + money(u.costUsd) + '</td></tr>';
        }).join("") + '</tbody></table>';
      return '<tr class="company" tabindex="0" aria-expanded="false" data-i="' + i + '"><td>' + name + '</td><td class="num">' + num(c.conversations) + '</td><td class="num">' + num(c.answers) + '</td><td class="num">' + num(c.inputTokens) + '</td><td class="num">' + num(c.outputTokens) + '</td><td class="num"><b>' + money(c.costUsd) + '</b></td><td>' + Math.round(share * 100) + '%<span class="share" style="width:' + Math.max(2, Math.round(share * 90)) + 'px"></span></td></tr>' +
        '<tr class="users" id="users-' + i + '" hidden><td colspan="7">' + users + '</td></tr>';
    }).join("");
    $("companies").innerHTML = head + rows + "</tbody></table>";
    Array.prototype.forEach.call(document.querySelectorAll("tr.company"), function (tr) {
      function toggle() {
        var u = $("users-" + tr.dataset.i), open = u.hidden;
        u.hidden = !open; tr.classList.toggle("open", open); tr.setAttribute("aria-expanded", String(open));
      }
      tr.addEventListener("click", toggle);
      tr.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); } });
    });
  }

  $("import").addEventListener("click", function () {
    var btn = $("import"), out = $("import-result");
    btn.disabled = true; btn.textContent = "מייבא…";
    fetch(base + "/api/usage/" + key + "/import-logs", { method: "POST", cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error("השרת החזיר " + r.status); return r.json(); })
      .then(function (x) {
        out.textContent = "נקראו " + x.files + " קבצי לוג, ונמצאו בהם " + num(x.callsFound) + " קריאות למודל" +
          (x.firstDay ? ", מ-" + x.firstDay + " עד " + x.lastDay : "") + ". נוספו " + num(x.imported) +
          ". " + num(x.alreadyThere) + " כבר היו שמורות, ו-" + num(x.afterLiveRecording) + " נרשמו כבר בזמן אמת.";
        out.hidden = false;
        load();
      })
      .catch(function (e) { out.textContent = "הייבוא נכשל: " + e.message; out.hidden = false; })
      .finally(function () { btn.disabled = false; btn.textContent = "ייבוא היסטוריה מהלוג"; });
  });

  document.querySelectorAll("[data-preset]").forEach(function (b) { b.addEventListener("click", function () { setPreset(b.dataset.preset); load(); }); });
  $("apply").addEventListener("click", load);
  setPreset("month");
  load();
})();
</script>
</body>
</html>
