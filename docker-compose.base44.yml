# Base44 development environment for the TripEx / Milo Lovable frontend.
#
# The app is a Vite + React + TypeScript SPA. Auth and AI/data calls go to the
# remote Supabase project (anon publishable key is committed in .env). The
# optional .NET backend (dotnet-backend/) is NOT wired here — it only activates
# when VITE_API_BASE_URL is set, and it needs SQL Server + an Oracle GenAI key.
#
# This service runs the Vite dev server from the cloned source with live reload.
services:
  web:
    image: node:22-bookworm-slim
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - "3000:8080"
    environment:
      # Vite 5.4.x backported the Host-header security check; allow all preview hosts.
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS=${BASE44_PUBLIC_HOST_SUFFIX}
      # Bind mounts often need polling for file-watch to fire reliably.
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    command: sh -c "npm install --no-audit --no-fund && npx vite --host 0.0.0.0 --port 8080"
    restart: on-failure
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:8080/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 90s
